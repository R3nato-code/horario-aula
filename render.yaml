# Blueprint do Render - Static Site do front-end (ADR-08; secao 4.2 de
# docs/arquitetura/deploy-render.md).
#
# Este arquivo NAO contem segredos. As variaveis VITE_* sao publicas
# (embutidas no bundle em tempo de build) e sao solicitadas no dashboard
# via `sync: false`. Regras e indices do Firestore NAO sao publicados por
# este deploy: use o Firebase CLI (indices -> regras -> front-end).
#
# O app usa roteamento por hash; o rewrite abaixo e defesa em profundidade
# para caminhos sem hash e para uma eventual migracao de roteamento.

previews:
  generation: off

services:
  - type: web
    name: horario-aula
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_DATA_MODE
        value: firebase
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: unsafe-none
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache